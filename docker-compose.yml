version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: powell_postgres
    restart: unless-stopped
    ports:
      - "5438:5432"
    environment:
      POSTGRES_USER: powellHomeSchool
      POSTGRES_PASSWORD: "@powe!!HomeSchool2025"
      POSTGRES_DB: powellHomeSchool
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: powell_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

volumes:
  postgres_data:
